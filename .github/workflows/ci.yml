name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go module and vendor state
        run: |
          go mod tidy
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Go test and vet
        run: |
          go test -mod=vendor ./...
          go vet -mod=vendor ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -buildvcs=false -trimpath ./cmd/server
      - name: Static security and license gates
        run: |
          ./scripts/verify-security.sh
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -d vendor
      - name: Real-SMS runner unit tests (no network)
        run: python3 -m unittest discover -s scripts/test -p 'test_*.py'
